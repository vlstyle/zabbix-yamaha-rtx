    - uuid: 29e80ce042594a0eac482c09778e42b5
      name: CPU3 utilization (1 min avg)
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.1182.2.1.18.1.4.4]
      key: system.cpu.util.core[yrhMultiCpuUtil1min.4]
      # delay: 1m
      # history: 31d
      # trends: 365d
      # value_type: UNSIGNED
      units: '%'
      description: |-
