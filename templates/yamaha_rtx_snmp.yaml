# Zabbixは既定値（delay: 1m / history: 31d / trends: 365d / value_type: UNSIGNED / error_handler: DISCARD_VALUE）を省略してエクスポートするため、
# インポート時の差分が出ないよう、既定値の行はコメントアウトして記載している。
zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: 04e17472128342918ad090ef7ebdcde2
    template: Yamaha RTX by SNMP
    name: Yamaha RTX by SNMP
    description: |
      Template for Yamaha RTX (SNMP). Based on the official Zabbix "Network Generic Device by SNMP" 7.0 template,
      with interface discovery using ifDescr because RTX does not return ifName/ifAlias.

      Template Net Network Generic Device

      MIBs used:
      SNMPv2-MIB
      IF-MIB

      Generated by official Zabbix template tool "Templator"
    groups:
    - name: Templates/Network devices
    items:
    - uuid: e69c1dac834e4814a514bfb46d369503
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      # delay: 1m
      history: 7d
      # trends: 365d
      # value_type: UNSIGNED
      description: |
        The host accessibility by ICMP ping.

        0 - ICMP ping fails;
        1 - ICMP ping successful.
      valuemap:
        name: Service state
      tags:
      - tag: component
        value: health
      - tag: component
        value: network
      triggers:
      - uuid: 6e5b50a918c646c594cee0f0ca20ed0f
        expression: max(/Yamaha RTX by SNMP/icmpping,#3)=0
        name: 'Yamaha RTX: Unavailable by ICMP ping'
        priority: HIGH
        description: Last three attempts returned timeout. Please check device connectivity.
        tags:
        - tag: scope
          value: availability
    - uuid: d243fefd39a2400f8e1273190cb575b7
      name: ICMP loss
      type: SIMPLE
      key: icmppingloss
      # delay: 1m
      history: 7d
      # trends: 365d
      value_type: FLOAT
      units: '%'
      description: The percentage of lost packets.
      tags:
      - tag: component
        value: health
      - tag: component
        value: network
      triggers:
      - uuid: 3669882cce654420ab436f4ab39b48c3
        expression: min(/Yamaha RTX by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Yamaha RTX by SNMP/icmppingloss,5m)<100
        name: 'Yamaha RTX: High ICMP ping loss'
        opdata: 'Loss: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: ICMP packets loss detected.
        dependencies:
        - name: 'Yamaha RTX: Unavailable by ICMP ping'
          expression: max(/Yamaha RTX by SNMP/icmpping,#3)=0
        tags:
        - tag: scope
          value: availability
        - tag: scope
          value: performance
    - uuid: 6f91ccaa3ea241aeb1e49dbcecc64259
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      # delay: 1m
      history: 7d
      # trends: 365d
      value_type: FLOAT
      units: s
      description: The ICMP ping response time (in seconds).
      tags:
      - tag: component
        value: health
      - tag: component
        value: network
      triggers:
      - uuid: a625abc9ac0b477d8749215acaaca872
        expression: avg(/Yamaha RTX by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}
        name: 'Yamaha RTX: High ICMP ping response time'
        opdata: 'Value: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: Average ICMP response time is too high.
        dependencies:
        - name: 'Yamaha RTX: High ICMP ping loss'
          expression: min(/Yamaha RTX by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Yamaha RTX by SNMP/icmppingloss,5m)<100
        - name: 'Yamaha RTX: Unavailable by ICMP ping'
          expression: max(/Yamaha RTX by SNMP/icmpping,#3)=0
        tags:
        - tag: scope
          value: availability
        - tag: scope
          value: performance
    - uuid: 62196b9bd21542ef8a3c3520e30dc8d6
      name: SNMP traps (fallback)
      type: SNMP_TRAP
      key: snmptrap.fallback
      delay: '0'
      # history: 31d
      trends: '0'
      value_type: LOG
      logtimefmt: hh:mm:sszyyyy/MM/dd
      description: The item is used to collect all SNMP traps unmatched by other snmptrap items
      tags:
      - tag: component
        value: network
    - uuid: 5c685008d3f642d89e21ef5ab7308298
      name: System contact details
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.4.0]
      key: system.contact[sysContact.0]
      delay: 1d
      history: 365d
      trends: '0'
      value_type: CHAR
      description: |
        MIB: SNMPv2-MIB
        The textual identification of the contact person for this managed node, together with information on how to contact this person. If no contact information is known, the value is the zero-length string.
      inventory_link: CONTACT
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: system
    - uuid: 46ea25847ec6485a867ebc71f712fde6
      name: System description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: system.descr[sysDescr.0]
      delay: 1d
      history: 365d
      trends: '0'
      value_type: CHAR
      description: |
        MIB: SNMPv2-MIB
        A textual description of the entity. This value should
        include the full name and version identification of the system's hardware type, software operating-system, and
        networking software.
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: system
    - uuid: 418fb83e07764fb08b6ec8f97131ffd9
      name: System location
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.6.0]
      key: system.location[sysLocation.0]
      delay: 1d
      history: 365d
      trends: '0'
      value_type: CHAR
      description: |
        MIB: SNMPv2-MIB
        Physical location of the node (e.g., `equipment room`, `3rd floor`). If not provided, the value is a zero-length string.
      inventory_link: LOCATION
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: system
    - uuid: f13d2f4a11b1404ea8ee9aef70f89b45
      name: System name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: system.name
      delay: 1d
      history: 365d
      trends: '0'
      value_type: CHAR
      description: |
        MIB: SNMPv2-MIB
        An administratively-assigned name for this managed node.By convention, this is the node's fully-qualified domain name. If the name is unknown, the value is the zero-length string.
      inventory_link: NAME
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: 52a9fe8d194f4350bf2d5784612e0ac4
        expression: last(/Yamaha RTX by SNMP/system.name,#1)<>last(/Yamaha RTX by SNMP/system.name,#2) and length(last(/Yamaha RTX by SNMP/system.name))>0
        name: 'Yamaha RTX: System name has changed'
        event_name: 'Yamaha RTX: System name has changed (new name: {ITEM.VALUE})'
        priority: INFO
        description: The name of the system has changed. Acknowledge to close the problem manually.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: notice
        - tag: scope
          value: security
    - uuid: 9783ba09420840d1b2d2fd386a379d26
      name: Uptime (network)
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: system.net.uptime[sysUpTime.0]
      # delay: 1m
      history: 7d
      # trends: 365d
      # value_type: UNSIGNED
      units: uptime
      description: |
        MIB: SNMPv2-MIB
        Time (in hundredths of a second) since the network management portion of the system was last re-initialized.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: f3b20849c9d54656890207c9bceab77b
        expression: last(/Yamaha RTX by SNMP/system.net.uptime[sysUpTime.0])<10m
        name: 'Yamaha RTX: Host has been restarted'
        event_name: 'Yamaha RTX: {HOST.NAME} has been restarted (uptime < 10m)'
        priority: WARNING
        description: Uptime is less than 10 minutes.
        manual_close: 'YES'
        dependencies:
        - name: 'Yamaha RTX: No SNMP data collection'
          expression: max(/Yamaha RTX by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        tags:
        - tag: scope
          value: notice
    - uuid: d2c6aa0cee5b4cfbb3c55023aadeeb34
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.2.0]
      key: system.objectid[sysObjectID.0]
      delay: 1d
      history: 365d
      trends: '0'
      value_type: CHAR
      description: |
        MIB: SNMPv2-MIB
        The vendor's authoritative identification of the network management subsystem contained in the entity. This value is allocated within the SMI enterprises subtree (1.3.6.1.4.1) and provides an easy and unambiguous means for determining`what kind of box' is being managed.  For example, if vendor`Flintstones, Inc.' was assigned the subtree1.3.6.1.4.1.4242, it could assign the identifier 1.3.6.1.4.1.4242.1.1 to its `Fred Router'.
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: system
    - uuid: 9e71aa894adf459ab5af1081fdbf14ed
      name: SNMP agent availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      # delay: 1m
      history: 7d
      # trends: 365d
      # value_type: UNSIGNED
      description: |
        Availability of SNMP checks on the host. The value of this item corresponds to availability icons in the host list.
        Possible values:
        0 - not available
        1 - available
        2 - unknown
      valuemap:
        name: zabbix.host.available
      tags:
      - tag: component
        value: health
      - tag: component
        value: network
      triggers:
      - uuid: 70faf9436c9046cba35d83679be6491f
        expression: max(/Yamaha RTX by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Yamaha RTX: No SNMP data collection'
        opdata: 'Current state: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: SNMP is not available for polling. Please check device connectivity and SNMP settings.
        dependencies:
        - name: 'Yamaha RTX: Unavailable by ICMP ping'
          expression: max(/Yamaha RTX by SNMP/icmpping,#3)=0
        tags:
        - tag: scope
          value: availability
    - uuid: 6f70ce7a05144ca683cfc37013289c9c
      name: CPU utilization (1 min avg)
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.1182.2.1.6.0]
      key: system.cpu.util[yrhCpuUtil1min.0]
      # delay: 1m
      # history: 31d
      # trends: 365d
      # value_type: UNSIGNED
      units: '%'
      description: |-
        MIB: YAMAHA-RT-HARDWARE
        CPU utilization, average over 1 minute.
      tags:
      - tag: component
        value: cpu
      triggers:
      - uuid: 66d8f6650e5b4e38a9eff8deafb042cd
        expression: min(/Yamaha RTX by SNMP/system.cpu.util[yrhCpuUtil1min.0],5m)>{$CPU.UTIL.CRIT}
        name: 'Yamaha RTX: High CPU utilization'
        event_name: 'Yamaha RTX: High CPU utilization (over {$CPU.UTIL.CRIT}% for 5m)'
        opdata: 'Current utilization: {ITEM.LASTVALUE1}'
        priority: AVERAGE
        description: Utilization of the whole CPU (1 min average) is too high. This trigger also draws the threshold line in the CPU utilization graph.
        tags:
        - tag: scope
          value: performance
    - uuid: d2944f3c71d5492780b23ec97c1dfcda
      name: Memory utilization
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.1182.2.1.4.0]
      key: vm.memory.util[yrhMemoryUtil.0]
      # delay: 1m
      history: 7d
      # trends: 365d
      # value_type: UNSIGNED
      units: '%'
      description: |-
        MIB: YAMAHA-RT-HARDWARE
        Utilization of the main memory.
      tags:
      - tag: component
        value: memory
      triggers:
      - uuid: eb0b08373f2d42c5be2caaa7a312ace0
        expression: min(/Yamaha RTX by SNMP/vm.memory.util[yrhMemoryUtil.0],5m)>{$MEMORY.UTIL.CRIT}
        name: 'Yamaha RTX: High memory utilization'
        event_name: 'Yamaha RTX: High memory utilization (>{$MEMORY.UTIL.CRIT}%)'
        opdata: 'Current utilization: {ITEM.LASTVALUE1}'
        priority: AVERAGE
        description: Main memory utilization is too high.
        tags:
        - tag: scope
          value: performance
    - uuid: 980c941a18c64a6184fb7fbb0b8528d1
      name: CPU0 utilization (1 min avg)
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.1182.2.1.18.1.4.1]
      key: system.cpu.util.core[yrhMultiCpuUtil1min.1]
      # delay: 1m
      # history: 31d
      # trends: 365d
      # value_type: UNSIGNED
      units: '%'
      description: |-
        MIB: YAMAHA-RT-HARDWARE
        Utilization of CPU0 (yrhMultiCpuIndex 1), average over 1 minute.
        No value is stored on models that do not have this core.
      preprocessing:
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        # error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: cpu
      - tag: cpu
        value: CPU0
      triggers:
      - uuid: 31ece0cae72c4ea4bb355909b404b35d
        expression: count(/Yamaha RTX by SNMP/system.cpu.util.core[yrhMultiCpuUtil1min.1],5m)>0 and min(/Yamaha RTX by SNMP/system.cpu.util.core[yrhMultiCpuUtil1min.1],5m)>{$CPU.UTIL.CRIT}
        name: 'Yamaha RTX: CPU0 high utilization'
        event_name: 'Yamaha RTX: CPU0 high utilization (over {$CPU.UTIL.CRIT}% for 5m)'
        opdata: 'Current utilization: {ITEM.LASTVALUE1}'
        priority: AVERAGE
        description: Utilization of CPU0 (1 min average) is too high.
        tags:
        - tag: scope
          value: performance
