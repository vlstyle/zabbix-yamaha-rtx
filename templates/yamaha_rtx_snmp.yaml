      - tag: cpu
        value: CPU1
      triggers:
      - uuid: 8fa7329810904f1a95dae203d6627c96
        expression: count(/Yamaha RTX by SNMP/system.cpu.util.core[yrhMultiCpuUtil1min.2],5m)>0 and min(/Yamaha RTX by SNMP/system.cpu.util.core[yrhMultiCpuUtil1min.2],5m)>{$CPU.UTIL.CRIT}
        name: 'Yamaha RTX: CPU1 high utilization'
        event_name: 'Yamaha RTX: CPU1 high utilization (over {$CPU.UTIL.CRIT}% for 5m)'
        opdata: 'Current utilization: {ITEM.LASTVALUE1}'
        priority: AVERAGE
        description: Utilization of CPU1 (1 min average) is too high.
        tags:
        - tag: scope
