        expression: count(/Yamaha RTX by SNMP/system.cpu.util.core[yrhMultiCpuUtil1min.3],5m)>0 and min(/Yamaha RTX by SNMP/system.cpu.util.core[yrhMultiCpuUtil1min.3],5m)>{$CPU.UTIL.CRIT}
        name: 'Yamaha RTX: CPU2 high utilization'
