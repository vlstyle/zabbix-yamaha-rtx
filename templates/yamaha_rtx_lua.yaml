# Zabbixは既定値（delay: 1m / history: 31d / trends: 365d / value_type: UNSIGNED / error_handler: DISCARD_VALUE）を省略してエクスポートするため、
# インポート時の差分が出ないよう、既定値の行はコメントアウトして記載している。
zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: 41a2956fa75a45f5a41d64b8b68c902a
    template: Yamaha RTX by Lua
    name: Yamaha RTX by Lua
    description: Packet buffer and external ping values pushed by /lua/zabbix_metrics.lua on the router through the history.push API (trapper items).
    groups:
    - name: Templates/Network devices
    items:
    - uuid: c01e9bbd63fc43a08d4b4e656621870e
      name: 'Packet buffer small: Usage'
      type: TRAP
      key: pktbuf.small.usage
      # delay: 1m
      # history: 31d
      # trends: 365d
      value_type: FLOAT
      units: '%'
      description: Allocated buffers as a percentage of max-buffer.
      tags:
      - tag: component
        value: packet-buffer
      - tag: group
        value: small
      triggers:
      - uuid: 4be7d2764f1f4175a3190014ee6216f6
        expression: min(/Yamaha RTX by Lua/pktbuf.small.usage,5m)>{$PKTBUF.USAGE.WARN}
        name: 'Yamaha RTX: Packet buffer small usage is high'
        opdata: 'Usage: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: Usage of the small packet buffer group has been above the threshold for 5 minutes.
        tags:
        - tag: scope
          value: capacity
    - uuid: ffc9f17f4de54c119f1e9a323d85f2fe
      name: 'Packet buffer small: Allocated buffers'
      type: TRAP
      key: pktbuf.small.allocated
      # delay: 1m
      # history: 31d
      # trends: 365d
      # value_type: UNSIGNED
      description: Number of buffers currently allocated.
      tags:
      - tag: component
        value: packet-buffer
      - tag: group
        value: small
    - uuid: 1182a7c31a114ec1a0926edafd1c5b50
      name: 'Packet buffer small: Free list buffers'
      type: TRAP
      key: pktbuf.small.free
      # delay: 1m
      # history: 31d
      # trends: 365d
      # value_type: UNSIGNED
      description: Number of buffers in the free list.
      tags:
      - tag: component
        value: packet-buffer
      - tag: group
        value: small
    - uuid: 53f1cf918c3a43cab7521be26efd3b38
      name: 'Packet buffer small: Allocation failures'
      type: TRAP
      key: pktbuf.small.fail
      # delay: 1m
      # history: 31d
      # trends: 365d
      # value_type: UNSIGNED
      description: Cumulative number of failed buffer allocations since boot.
      tags:
      - tag: component
        value: packet-buffer
      - tag: group
        value: small
      triggers:
      - uuid: 0396bec4391447288470da301a6865d4
        expression: change(/Yamaha RTX by Lua/pktbuf.small.fail)>0
        name: 'Yamaha RTX: Packet buffer small allocation failed'
        opdata: 'Failures: {ITEM.LASTVALUE1}'
        priority: AVERAGE
        description: The small packet buffer group failed to allocate buffers since the previous value.
        tags:
        - tag: scope
          value: capacity
    - uuid: 046842591cb44778ae460593505004b7
      name: 'Packet buffer small: Allocated chunks'
